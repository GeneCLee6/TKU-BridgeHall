<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 96" role="img" aria-labelledby="t">
  <title id="t">TKU BridgeBook · 淡江橋譜</title>
  <style>
    .navy { fill: #0f3d7a; }
    .word { fill: #0f3d7a; } .zh { fill: #0f3d7a; } .badge-text { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .word, .zh { fill: #e6ebf3; }
    }
  </style>
  <g transform="translate(6 6) scale(1.25)">
    <!-- Cover (gold edge under the pages) -->
    <path d="M32 19.6c-6-4.2-17-4.9-26-2.7V51c9-2.2 20-1.2 26 3 6-4.2 17-5.2 26-3V16.9c-9-2.2-20-1.5-26 2.7z" fill="#f2b84b"/>
    <!-- Pages -->
    <path d="M31 20.5c-5.6-3.6-14-4.4-22-2.6v30c8-1.8 16.4-1 22 2.6z" fill="#fff8e6"/>
    <path d="M33 20.5c5.6-3.6 14-4.4 22-2.6v30c-8-1.8-16.4-1-22 2.6z" fill="#fff8e6"/>
    <!-- Suits: spade and heart on the left page, diamond and club on the right -->
    <path transform="translate(15 23.5)" d="M5 0C3.5 2 0 3.6 0 6c0 1.4 1.1 2.3 2.3 2.3.7 0 1.3-.3 1.7-.7L3.3 10h3.4L6 7.6c.4.4 1 .7 1.7.7C8.9 8.3 10 7.4 10 6 10 3.6 6.5 2 5 0z" fill="#0f3d7a"/>
    <path transform="translate(15 36)" d="M5 9.5 1 5.5C-.6 3.9.2.8 2.6.8c1.1 0 1.9.7 2.4 1.6.5-.9 1.3-1.6 2.4-1.6 2.4 0 3.2 3.1 1.6 4.7z" fill="#c8102e"/>
    <path transform="translate(39 23.5)" d="M5 0l4 5-4 5-4-5z" fill="#d35400"/>
    <g transform="translate(39 36)" fill="#1b7a33"><circle cx="5" cy="2.6" r="2.4"/><circle cx="2.4" cy="5.7" r="2.4"/><circle cx="7.6" cy="5.7" r="2.4"/><path d="M5 3.5 6.6 6.3H3.4z"/><path d="M4.3 5h1.4l1 4.8H3.3z"/></g>
    <!-- Bookmark ribbon from the spine -->
    <path d="M29.6 50.5h4.8V61L32 58.4 29.6 61z" fill="#c8102e"/>
  </g>
  <!-- TKU monogram -->
  <rect x="98" y="14" width="80" height="38" rx="8" class="navy"/>
  <rect x="98" y="48" width="80" height="4" fill="#d9a330"/>
  <text x="138" y="43" text-anchor="middle" class="badge-text" font-family="'Arial Black','Segoe UI',Arial,sans-serif" font-weight="900" font-size="27" letter-spacing="2">TKU</text>
  <!-- Wordmark -->
  <text x="188" y="44" class="word" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="30">BridgeBook</text>
  <text x="99" y="84" class="zh" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-weight="700" font-size="24" letter-spacing="4">淡江橋譜</text>
  <text x="228" y="83" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" letter-spacing="1"><tspan class="word">♠</tspan><tspan fill="#c8102e">♥♦</tspan><tspan class="word">♣ 橋藝社制度手冊</tspan></text>
</svg>
