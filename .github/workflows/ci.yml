name: CI

# Runs on every push and on pull requests targeting main: install -> lint -> typecheck/build -> test.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type check and build
        run: npm run build

      - name: Unit and component tests (Vitest)
        run: npm run test
